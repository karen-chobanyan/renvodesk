# Install as /etc/nginx/conf.d/renvodesk-api-limits.conf (http context).
# Per-client request rate for /api/. The browser polls an analysis every 2–5 s,
# so 5 requests/second with a small burst leaves ample room for normal use.
limit_req_zone $binary_remote_addr zone=renvodesk_api:10m rate=5r/s;
limit_req_status 429;
