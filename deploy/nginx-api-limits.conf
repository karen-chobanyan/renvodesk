# Install as /etc/nginx/conf.d/renvodesk-api-limits.conf (http context).
# Only defines the zone: the 429 status is set inside the RenvoDesk /api/
# location so other sites on a shared Nginx keep their own behavior.
# The browser polls an analysis every 2–5 s; 5 requests/second per client
# with a small burst leaves ample room for normal use.
limit_req_zone $binary_remote_addr zone=renvodesk_api:10m rate=5r/s;
