# Install as /etc/nginx/sites-available/renvodesk, then enable and run Certbot.
server {
    listen 80;
    listen [::]:80;
    server_name www.renvodesk.com;
    return 308 https://renvodesk.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name renvodesk.com;
    root /var/www/renvodesk/current;
    index index.html;

    # Avoid recording auth callback codes and invitation tokens in access logs.
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    expires -1;

    location = /en { return 308 /en/; }
    location = /terms { return 308 /terms/; }
    location = /en/terms { return 308 /en/terms/; }
    location = /privacy { return 308 /privacy/; }
    location = /en/privacy { return 308 /en/privacy/; }

    location = / { try_files /index.html =404; }
    location = /en/ { try_files /en/index.html =404; }
    location = /terms/ { try_files /terms/index.html =404; }
    location = /en/terms/ { try_files /en/terms/index.html =404; }
    location = /privacy/ { try_files /privacy/index.html =404; }
    location = /en/privacy/ { try_files /en/privacy/index.html =404; }

    # Only internal application routing may serve this shell.
    location = /app.html {
        internal;
        try_files /app.html =404;
        # Nginx header inheritance is replaced when add_header occurs here.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ~ (^|/)\. { return 404; }
    location ~ \.map$ { return 404; }
    location ~ ^/(index\.html|en/index\.html|privacy/index\.html|en/privacy/index\.html|terms/index\.html|en/terms/index\.html)$ { return 404; }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    # Ubuntu Nginx mime.types may not map .mjs (the PDF worker).
    location ~ ^/assets/[A-Za-z0-9_.-]+\.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
        expires 1y;
    }
    location /fonts/ { try_files $uri =404; }
    location /images/ { try_files $uri =404; }
    location /excalidraw/ { try_files $uri =404; }
    location = /favicon.svg { try_files $uri =404; }
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }

    location ~ ^/(login|signup|auth/(forgot|reset|callback)|invite/[^/]+|workspace|workspace/[^/]+/(team|clients|estimates|settings|schedule)|workspace/[^/]+/projects/[^/]+(/(sketches|estimates)/[^/]+)?|projects(/[^/]+)?|estimates/[^/]+|design-system)/?$ {
        rewrite ^ /app.html last;
    }
    location / { return 404; }
}
